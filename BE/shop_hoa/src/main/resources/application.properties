spring.application.name=shop_hoa

# 1. Cấu hình Database
spring.datasource.url=jdbc:mysql://localhost:3306/shop_hoa?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345678

# 2. Hibernate/JPA settings
# update: Tự động tạo bảng nếu chưa có, hoặc cập nhật nếu có thay đổi
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html
#http://localhost:8080/swagger-ui/index.html